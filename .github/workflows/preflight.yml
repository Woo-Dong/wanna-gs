name: preflight
on:
  push:
    branches: ['codex/preflight-20260921-*']
  pull_request:
    branches: ['codex/preflight-20260921-*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
